name: Simple CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATA_MONGODB_URI: mongodb://127.0.0.1:27017/doneit
    
    steps:
      # 1. Checkout code    
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Backend - Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run Backend Tests
        run: ./mvnw clean test

      - name: Build Backend
        run: ./mvnw clean package

      # 3. Frontend - Node 18
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          REACT_APP_API_URL: http://localhost:8080/api

      # 4. Résultat
      - name: Success
        run: echo "Build completed successfully!"




